[tools]
git-cliff = "2"
cargo-release = "1"
hk = { version = "latest", minimum_release_age = "0s" }
cargo-binstall = "latest"
pkl = "latest"

[tasks.changelog]
description = "Generate changelog"
run = "git cliff -o CHANGELOG.md"

[tasks.coverage]
tools = { "cargo:cargo-tarpaulin" = "0.27" }
depends = [ "lint" ]
description = "Run tests with coverage"
run = "cargo tarpaulin --lib --tests"

[tasks."build-docker-vhs"]
description = "Build the vhs docker image"
run = """
#!/usr/bin/env bash

if ! docker info > /dev/null 2>&1; then
  echo "This script uses docker, and it isn't running - please start docker and try again!"
  exit 1
fi

docker build -t vhs ./assets/vhs/
"""

[tasks."recordings input"]
description = "Record all prompt demos"
depends = [ "build-docker-vhs" ]
run = "bash assets/record.sh assets/*.tape"

[tasks.recording]
description = "Record one VHS tape"
depends = [ "build-docker-vhs" ]
usage = 'arg "<recording>" help="VHS tape file"'
run = 'bash assets/record.sh "${usage_recording?}"'

[tasks."recordings themes"]
description = "Record all theme demos"
depends = [ "build-docker-vhs" ]
run = "bash assets/record.sh assets/themes/*.tape"

[tasks.test]
alias = ["t", "tests"]
depends = ["lint"]
description = "Run tests"
run = "cargo test --lib --tests"

[tasks.release]
run = 'cargo release'

[tasks.lint]
run = ["cargo clippy -- -D warnings", "cargo fmt -- --check"]

[tasks.pre-commit]
depends = ["lint"]
